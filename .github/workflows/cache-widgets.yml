name: cache readme widgets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: create assets folder
        run: mkdir -p assets

      - name: fetch trophies svg
        run: curl -sL "https://github-profile-trophy.vercel.app/?username=Ayushkumar639&theme=tokyonight&no-frame=true&row=2&column=4&margin-w=15&margin-h=15" -o assets/trophies.svg

      - name: fetch activity graph svg
        run: curl -sL "https://github-readme-activity-graph.vercel.app/graph?username=Ayushkumar639&bg_color=0D1117&color=A78BFA&line=8B5CF6&point=C4B5FD&area=true&area_color=6D28D9&hide_border=true" -o assets/activity-graph.svg

      - name: verify files are non-empty
        run: |
          test -s assets/trophies.svg || (echo "::error::trophies.svg is empty - the trophy service likely failed to respond" && exit 1)
          test -s assets/activity-graph.svg || (echo "::error::activity-graph.svg is empty - the activity graph service likely failed to respond" && exit 1)

      - name: commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh readme widgets"
          file_pattern: "assets/trophies.svg assets/activity-graph.svg"
