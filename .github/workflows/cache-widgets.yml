name: cache readme widgets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: create assets folder
        run: mkdir -p assets

      - name: fetch trophies svg
        run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            "https://trophy.benkou.dev/?username=Ayushkumar639&theme=tokyonight&no-frame=true&row=2&column=4&margin-w=15&margin-h=15" \
            -o assets/trophies.svg

      - name: fetch activity graph svg
        run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            "https://fabianocouto-activity-graph.vercel.app/graph/?username=Ayushkumar639&bg_color=0D1117&color=A78BFA&line=8B5CF6&point=C4B5FD&area=true&area_color=6D28D9&hide_border=true" \
            -o assets/activity-graph.svg

      - name: verify files are valid svg
        run: |
          if ! head -c 200 assets/trophies.svg | grep -qi "<svg\|<?xml"; then
            echo "::error::trophies.svg is not valid SVG. First 300 bytes of what was actually saved:"
            head -c 300 assets/trophies.svg
            exit 1
          fi
          if ! head -c 200 assets/activity-graph.svg | grep -qi "<svg\|<?xml"; then
            echo "::error::activity-graph.svg is not valid SVG. First 300 bytes of what was actually saved:"
            head -c 300 assets/activity-graph.svg
            exit 1
          fi

      - name: commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh readme widgets"
          file_pattern: "assets/trophies.svg assets/activity-graph.svg"
