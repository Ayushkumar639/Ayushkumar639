<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1b2b"/>
      <stop offset="100%" stop-color="#142639"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c4550"/>
      <stop offset="100%" stop-color="#5FD8C9"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#6e480f"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5FD8C9" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="aiClip">
      <circle cx="960" cy="130" r="86"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="260" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" fill="url(#gridPattern)"/>

  <!-- corner brackets -->
  <g stroke="#5FD8C9" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 24 48 L 24 24 L 48 24"/>
    <path d="M 1176 48 L 1176 24 L 1152 24"/>
    <path d="M 24 212 L 24 236 L 48 236"/>
    <path d="M 1176 212 L 1176 236 L 1152 236"/>
  </g>

  <!-- left text block -->
  <text x="64" y="86" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#5FD8C9">// AVIONICS ENGINEER · FULL-STACK DEVELOPER</text>

  <text x="62" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#EAF3F1">AYUSH KUMAR</text>

  <text x="64" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#9fb3bf">B.Tech ECE (Avionics) — sensor fusion, embedded systems, and web apps that fly.</text>

  <text x="64" y="212" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" letter-spacing="1" fill="#5FD8C9" opacity="0.75">LAT 32.5°N · LON 75.6°E · JAMMU, INDIA</text>

  <!-- attitude indicator -->
  <g clip-path="url(#aiClip)">
    <rect x="874" y="44" width="172" height="86" fill="url(#skyGrad)"/>
    <rect x="874" y="130" width="172" height="86" fill="url(#groundGrad)"/>
    <line x1="874" y1="130" x2="1046" y2="130" stroke="#EAF3F1" stroke-width="2"/>
    <line x1="930" y1="110" x2="990" y2="110" stroke="#EAF3F1" stroke-width="1.2" opacity="0.8"/>
    <line x1="930" y1="150" x2="990" y2="150" stroke="#EAF3F1" stroke-width="1.2" opacity="0.8"/>
    <line x1="915" y1="90" x2="1005" y2="90" stroke="#EAF3F1" stroke-width="1" opacity="0.55"/>
    <line x1="915" y1="170" x2="1005" y2="170" stroke="#EAF3F1" stroke-width="1" opacity="0.55"/>
  </g>

  <!-- bezel + ticks -->
  <circle cx="960" cy="130" r="88" fill="none" stroke="#5FD8C9" stroke-width="2.5"/>
  <g stroke="#5FD8C9" stroke-width="2">
    <line x1="960" y1="38" x2="960" y2="50" />
    <line x1="960" y1="210" x2="960" y2="222" />
    <line x1="868" y1="130" x2="880" y2="130" />
    <line x1="1040" y1="130" x2="1052" y2="130" />
  </g>

  <!-- fixed aircraft symbol -->
  <g stroke="#F2A93B" stroke-width="4" stroke-linecap="round">
    <line x1="918" y1="130" x2="944" y2="130"/>
    <line x1="976" y1="130" x2="1002" y2="130"/>
  </g>
  <circle cx="960" cy="130" r="3.5" fill="#F2A93B"/>
</svg>
